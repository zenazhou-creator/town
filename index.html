if(!REDUCED){
  var cv=el("canvas");cv.id="fx";document.body.appendChild(cv);
  var cx=cv.getContext("2d"),P=[],run=false,dpr=Math.min(devicePixelRatio||1,2),FX=[185,318,85,35];
  function rsz(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  rsz();addEventListener("resize",rsz);
  function add(x,y,k,burst){
    for(var i=0;i<k&&P.length<420;i++){var a=Math.random()*6.283,s=burst?1+Math.random()*3.2:.3+Math.random()*1.1;
      P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(burst?0:.25),l:1,d:.016+Math.random()*.02,r:1+Math.random()*2.4,h:pick(FX)})}
    if(!run){run=true;requestAnimationFrame(loop)}
  }
  function loop(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    var day=root.dataset.theme==="day";cx.globalCompositeOperation=day?"source-over":"lighter";
    for(var i=P.length-1;i>=0;i--){
      var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.l-=p.d;
      if(p.l<=0){P.splice(i,1);continue}
      cx.fillStyle="hsla("+p.h+",100%,"+(day?48:66)+"%,"+p.l+")";
      cx.beginPath();cx.arc(p.x,p.y,p.r*p.l+.4,0,6.283);cx.fill();
    }
    if(P.length)requestAnimationFrame(loop);else run=false;
  }
  addEventListener("pointermove",function(e){add(e.clientX,e.clientY,2,false)});
  addEventListener("pointerdown",function(e){add(e.clientX,e.clientY,20,true)});
}
